name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

jobs:
  sync-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          # 用 GITHUB_TOKEN 认证请求 API。匿名请求走的是 Actions 共享出口 IP，
          # 60 次/小时极易被限流；届时拿到的是错误 JSON，字段解析为空，
          # 最终会误报成"未找到 Pages.zip"。认证后额度按本仓库计，不受牵连。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 带认证 + 退避重试的 GET。成功返回 0，失败返回 1。
          gh_get() {
            url="$1"; dest="$2"
            # token 缺失时降级为匿名请求：空 Bearer 会被判 401，比匿名更糟
            auth=()
            if [ -n "${GH_TOKEN:-}" ]; then
              auth=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            for try in 1 2 3 4 5; do
              code=$(curl -sS -o "$dest" -w '%{http_code}' \
                "${auth[@]}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --connect-timeout 10 --max-time 30 "$url" 2>/dev/null) || code=000
              case "$code" in
                2*) return 0 ;;
                401) echo "错误：认证被拒（HTTP 401），GITHUB_TOKEN 有问题，不重试"; return 1 ;;
                404) echo "错误：目标不存在（HTTP 404），不重试"; return 1 ;;
              esac
              # 000/403/429/5xx 才值得重试：网络抖动、限流、上游临时故障
              echo "第 ${try} 次请求 HTTP ${code}，退避后重试..."
              [ "$try" = "5" ] || sleep $((try * 15))
            done
            echo "错误：${url} 连续 5 次未拿到 2xx"
            return 1
          }

          # 获取最新 release 信息
          echo "正在获取最新发布信息..."
          gh_get https://api.github.com/repos/byJoey/cfnew/releases/latest /tmp/latest.json || exit 1
          LATEST_RELEASE=$(cat /tmp/latest.json)

          # 使用 sed 提取版本号（兼容性更好）
          VERSION=$(echo "$LATEST_RELEASE" | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "错误：响应里没有 tag_name，前 300 字节如下："
            head -c 300 /tmp/latest.json; echo
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"

          # 获取所有 assets 文件
          ASSETS_URL=$(echo "$LATEST_RELEASE" | sed -n 's/.*"assets_url": "\([^"]*\)".*/\1/p')
          if [ -z "$ASSETS_URL" ]; then
            echo "错误：响应里没有 assets_url"
            exit 1
          fi
          echo "正在获取文件列表..."
          gh_get "$ASSETS_URL" /tmp/assets.json || exit 1
          ASSETS=$(cat /tmp/assets.json)

          # 查找 Pages.zip 文件
          # 使用更可靠的方法查找包含 Pages.zip 的下载 URL
          DOWNLOAD_URL=$(echo "$ASSETS" | grep -i "Pages\.zip" | grep -o '"browser_download_url": "[^"]*"' | sed 's/"browser_download_url": "\([^"]*\)"/\1/' | head -1)
          FILE_NAME="Pages.zip"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 Pages.zip 文件"
            echo "可用的文件列表："
            echo "$ASSETS" | grep -o '"name": "[^"]*"' | sed 's/"name": "\([^"]*\)"/  - \1/'
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        run: |
          # 读取当前记录的版本，如果文件不存在则创建空文件
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi
          
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # 如果版本文件不存在或为空，或者版本不同，则需要更新
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi
          
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi
          
          echo "正在下载文件: $FILE_NAME"
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          
          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi
          
          echo "下载成功: $FILE_NAME"
          
          # 解压缩 Pages.zip
          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .
          
          if [ $? -ne 0 ]; then
            echo "错误：解压缩失败"
            exit 1
          fi
          
          echo "解压缩成功"
          
          # 删除 zip 文件（可选，如果不需要保留）
          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"
          
          # 确保创建或更新版本记录文件
          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi
          
          # 写入版本号
          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"
          
          # 验证文件是否成功写入
          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi
      
      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi
      
      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi

